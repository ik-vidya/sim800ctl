name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build (no CGO)
        run: CGO_ENABLED=0 go build ./...

      - name: cross-compile
        run: |
          mkdir -p /tmp/out
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o /tmp/out/sim800ctl-linux-amd64       ./cmd/sim800ctl
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o /tmp/out/sim800ctl-linux-arm64       ./cmd/sim800ctl
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/out/sim800ctl-windows-amd64.exe ./cmd/sim800ctl
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o /tmp/out/sim800ctl-darwin-arm64      ./cmd/sim800ctl
          ls -la /tmp/out
